name: Lisofy
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  flutter_typeahead: ^5.2.0
  intl: ^0.20.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  fluttertoast: ^8.2.8
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  permission_handler: ^12.0.1
  device_info_plus: ^11.4.0
  connectivity_plus: ^6.1.5
  rxdart: ^0.28.0
  google_maps_flutter: ^2.10.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  http: ^1.2.2
  path: ^1.9.0
  flutter_spinkit: ^5.2.1
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.1
  video_thumbnail: ^0.5.3   # updated to v2 embedding version
  share_plus: ^11.1.0
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.0
  intl_utils: ^2.8.7
  animation_wrappers: ^3.0.0
  webview_flutter: ^4.13.0
  http_parser: ^4.0.2
  super_tooltip: ^2.0.9
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  location: ^8.0.1
  file_picker: ^10.3.1
 # replacing old toast package
  uuid: ^4.5.1
  flutter_svg: ^2.0.16
  flutter_rating_bar: ^4.0.1   # added latest version instead of empty
  cached_network_image: ^3.4.1
  shimmer_animation: ^2.2.1
  sliding_up_panel: ^2.0.0+1
  lottie: ^3.3.1
  shimmer: ^3.0.0
  path_provider: ^2.1.5
  sms_autofill: ^2.4.0
  google_sign_in: ^6.2.1
  flutter_native_splash: ^2.4.4
  animate_do: ^4.1.1
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_new_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: "assets/icon/native_icon.png"
  android_12:
    image: "assets/icon/native_icon.png"
    icon_background_color: "#ffffff"
  fullscreen: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - lib/l10n/
    - assets/lottie/tickAnimate.json
    - assets/lottie/addedAnimation.json

  fonts:
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/Mulish-Bold.ttf
          weight: 700
        - asset: assets/fonts/Mulish-Italic.ttf
          style: italic
        - asset: assets/fonts/Mulish-Medium.ttf
        - asset: assets/fonts/Mulish-Regular.ttf
